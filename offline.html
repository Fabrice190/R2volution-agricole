<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors connexion — REVAGRIK</title>
  <meta name="theme-color" content="#05507E">
  <link rel="icon" type="image/png" href="assets/logo/icon-192.png">
  <link rel="stylesheet" href="styles/theme.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #FAF7F0;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      border: 1px solid #ECE6D9;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(5, 80, 126, 0.08);
    }
    .offline-icon-wrap {
      width: 80px;
      height: 80px;
      background: #E6EFF6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #05507E;
    }
    .offline-title {
      font-size: 22px;
      font-weight: 800;
      color: #05507E;
      margin-bottom: 10px;
    }
    .offline-text {
      font-size: 14px;
      line-height: 1.55;
      color: #4A4A4A;
      margin-bottom: 24px;
    }
    .offline-hint {
      background: #F6EADF;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12.5px;
      color: #A85A1C;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #05507E;
      color: #FFFFFF;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 80, 126, 0.25);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background: #043E62;
      transform: translateY(-1px);
    }
    .brand-sub {
      margin-top: 24px;
      font-size: 11.5px;
      color: #7C8781;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div style="margin-bottom: 18px;">
      <img src="assets/logo/logo-revagrik.png" alt="REVAGRIK - Révolution Agricole" style="height: 38px; width: auto; max-width: 200px; object-fit: contain; display: inline-block;">
    </div>
    <div class="offline-icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 class="offline-title">Vous êtes hors connexion</h1>
    <p class="offline-text">
      Votre connexion Internet semble interrompue. Les données enregistrées sur votre appareil restent protégées.
    </p>
    <div class="offline-hint">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>Dès que le réseau sera rétabli, vos synchronisations avec Supabase reprendront automatiquement.</span>
    </div>
    <button type="button" class="btn-retry" onclick="window.location.reload();">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      <span>Réessayer la connexion</span>
    </button>
    <div class="brand-sub">REVAGRIK • Révolution Agricole • Burkina Faso</div>
  </main>
</body>
</html>
